<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121a28">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>鑑識現場 Forensic Scene</title>
<style>
:root{--bg:#121a28;--panel:#1c2638;--panel2:#24314a;--ink:#e9eef5;--dim:#9aa8bd;--teal:#2bb3a3;--amber:#f2a541;--red:#e0645a;--violet:#8a6fd1;--blue:#4fd2ff;--line:#33435e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--teal);border-color:#3fd0bf;color:#06201d;font-weight:700}
button.warn{background:#5a2a2a;border-color:#8a3d3d}
button.amber{background:var(--amber);border-color:#ffc477;color:#2a1a04;font-weight:700}
input,select{font:inherit;color:var(--ink);background:#0f1522;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
select option{background:#0f1522;color:var(--ink)}
.hidden{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* ---- 大廳 ---- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f18 center/cover no-repeat;z-index:30;overflow:auto;padding:16px}
.card{background:rgba(22,30,46,.92);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.logo{position:relative;text-align:center;margin:-4px 0 6px}
.logo img{width:100%;max-width:460px;display:block;margin:0 auto;opacity:.85}
.logo h1{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);margin:0;font-size:clamp(26px,6vw,40px);letter-spacing:4px;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.8)}
.logo .sub{color:var(--amber);font-size:15px;margin-top:2px;letter-spacing:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.row>label{color:var(--dim);font-size:14px;min-width:56px}
.agents{display:flex;gap:8px}
.agents button{padding:4px;width:64px;height:76px;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;background:#0f1522}
.agents button img{height:68px}
.agents button.on{outline:3px solid var(--amber)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big button{padding:14px 10px;font-size:17px}
.note{color:var(--dim);font-size:13px;line-height:1.6}
#joinCode{width:110px;font-size:20px;letter-spacing:6px;text-align:center}
.srv{font-size:12px;color:var(--dim);margin-top:8px}
/* 房間 */
.code{font-size:44px;letter-spacing:10px;font-weight:800;color:var(--amber);text-align:center}
.plist{display:grid;gap:8px;margin:12px 0}
.pl{display:flex;align-items:center;gap:10px;background:#0f1522;border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-height:56px}
.pl img{height:48px}
.pl .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;border-radius:8px;padding:2px 7px;background:#2a3650;white-space:nowrap;display:inline-block}
.tag.host{background:#6b4a12;color:#ffd58a}.tag.ok{background:#1b4a42;color:#8ff0df}.tag.off{background:#4a2222;color:#ffb3b3}.tag.vc{background:#3b2f63;color:#d6c8ff}
/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
.tl{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;max-width:min(380px,60vw)}
.chip{background:rgba(18,26,40,.88);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.ap{display:flex;align-items:center;gap:8px;font-weight:700}
.ap .n{font-size:22px;color:var(--amber)}
.pips{display:flex;gap:3px;flex-wrap:wrap;max-width:200px}
.pips i{width:9px;height:14px;border-radius:3px;background:var(--amber);display:block}
.pips i.u{background:#3a465c}
.pips .patl{font-size:11px;color:var(--dim);white-space:nowrap}
.pips .patb{display:block;width:120px;height:6px;border-radius:3px;background:#2a3446;overflow:hidden;align-self:center}
.pips .patb i{height:100%;width:100%;border-radius:3px;transition:width 1s}
.team{display:flex;gap:6px;flex-wrap:wrap}
.team .chip{padding:3px 8px;font-size:13px;display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.labs{font-size:13px;color:#cfe;line-height:1.5}
.tr{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:52vw}
.tr button{padding:7px 10px;background:rgba(28,38,56,.92)}
.tr button .lbl{margin-left:3px}
.room{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);font-weight:700;color:#fff;text-shadow:0 2px 4px #000;font-size:15px;pointer-events:none}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:flex-end}
.slot{width:54px;height:54px;border-radius:12px;background:rgba(18,26,40,.88);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.slot img{width:44px;height:44px}
.slot.bag{border-style:dashed}
.slot .chg{position:absolute;right:-4px;bottom:-4px;background:#1d6b63;color:#dff;font-size:11px;font-weight:700;border-radius:8px;padding:1px 5px}
.slot .chg.z{background:#7a3b2e}
.slot small{position:absolute;bottom:-1px;right:3px;font-size:11px;color:var(--amber);font-weight:700}
.sep{width:8px}
#act{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(560px,94vw);background:rgba(18,26,40,.95);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#act h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
#act .ah{display:flex;align-items:center;gap:6px;font-size:15px;margin-bottom:4px;flex-wrap:wrap}
#act .ah small{color:var(--dim);font-size:12px}
#act .ai{width:28px;height:28px}
#act .ad{color:var(--dim);font-size:12px;line-height:1.4;margin-bottom:6px}
#act kbd{display:none;min-width:18px;padding:0 5px;border-radius:5px;background:#f2d045;color:#1d2333;font:700 12px/18px sans-serif;text-align:center;box-shadow:0 2px 0 #9c7f1c}
#act .dn{font-size:12px;color:var(--dim);align-self:center}
/* 電腦版：物件旁邊的小清單（半透明、數字鍵） */
body.kb #act{left:0;top:0;bottom:auto;transform:none;width:auto;max-width:330px;min-width:200px;background:rgba(12,18,30,.72);backdrop-filter:blur(3px);border-color:rgba(120,140,170,.35);border-radius:12px;padding:7px 9px;pointer-events:auto}
body.kb #act .ad{display:none}
body.kb #act .btns{flex-direction:column;gap:2px}
body.kb #act .btns button{background:transparent;border:0;padding:3px 4px;font-size:13px;justify-content:flex-start;text-align:left;box-shadow:none;color:#e9eef5;border-radius:6px}
body.kb #act .btns button:hover:not([disabled]){background:rgba(255,255,255,.08)}
body.kb #act .btns button[disabled]{opacity:.45}
body.kb #act kbd{display:inline-block}
body.kb #act .why{font-size:11px}
#act button.done{opacity:.4;text-decoration:line-through}
#act .ok{color:#8ff0df;font-size:12px;text-decoration:none}
@media (max-width:640px){#act button.done{display:none}}
body.kb .bar{left:auto;right:12px;transform:none;opacity:.78;gap:4px}
body.kb .slot{width:42px;height:42px;border-radius:10px}
body.kb .slot img{width:34px;height:34px}
body.kb #toasts{bottom:calc(14px + env(safe-area-inset-bottom))}
body.kb .keyhelp{display:block}
.kbonly{display:none}body.kb .kbonly{display:inline}body.kb .touchonly{display:none}
kbd.k{display:inline-block;min-width:16px;padding:0 4px;border-radius:4px;background:#f2d045;color:#1d2333;font:700 12px/17px sans-serif;text-align:center}
#alertBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:6;background:rgba(40,24,22,.88);border:1px solid #b8574f;color:#ffe3dc;border-radius:12px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:min(560px,92vw)}
#alertBar.run{border-color:#e07a5f}
#alertBar button{background:#b8574f;color:#fff;border:0;border-radius:8px;padding:4px 10px;font-size:13px;display:flex;align-items:center;gap:5px}
#alertBar small{color:#d9b8b0;font-size:11px}
@media (max-width:640px){#alertBar{top:auto;bottom:calc(130px + env(safe-area-inset-bottom));font-size:13px}}
.keyhelp{display:none;position:absolute;right:12px;bottom:62px;font-size:11px;color:rgba(220,230,240,.7);background:rgba(12,18,30,.5);padding:3px 8px;border-radius:8px;pointer-events:none}
#act p{margin:0 0 8px;color:var(--dim);font-size:13px;line-height:1.5}
#act .btns{display:flex;flex-wrap:wrap;gap:6px}
#act .btns button{display:flex;align-items:center;gap:6px;font-size:14px;padding:7px 10px}
.cost{background:var(--amber);color:#2a1a04;border-radius:8px;padding:0 6px;font-weight:800;font-size:12px}
.why{font-size:11px;color:#ffb3a8}
#toasts{position:absolute;left:calc(10px + env(safe-area-inset-left));bottom:calc(80px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;max-width:min(420px,70vw);pointer-events:none}
.toast{background:rgba(10,14,22,.85);border-left:3px solid var(--teal);border-radius:8px;padding:5px 9px;font-size:13px;animation:fin .25s}
.toast.bad{border-color:var(--red)}
@keyframes fin{from{opacity:0;transform:translateY(6px)}}
#cards{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;width:min(440px,92vw)}
.evc{display:flex;gap:10px;background:rgba(14,22,36,.97);border:2px solid var(--blue);border-radius:14px;padding:10px;box-shadow:0 0 30px rgba(79,210,255,.3);animation:fin .3s;cursor:pointer}
.evc.lab{border-color:var(--amber);box-shadow:0 0 30px rgba(242,165,65,.35)}
.evc img{width:56px;height:56px;flex:none}
.evc b{display:block;margin-bottom:2px}
.evc span{font-size:13px;color:#cdd8e6;line-height:1.5}
.evc em{font-style:normal;font-size:11px;color:var(--blue)}
/* 搖桿 */
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);pointer-events:none;z-index:9;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.3)}
/* ---- 視窗 ---- */
.ov{position:fixed;inset:0;background:rgba(5,8,14,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.win{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(880px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.6)}
.win>header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.win>header h2{margin:0;font-size:18px;flex:1}
.win>.body{padding:12px 14px;overflow:auto;-webkit-overflow-scrolling:touch}
.win>footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.van .body{background:linear-gradient(rgba(18,24,36,.82),rgba(18,24,36,.9)),var(--vanbg) center/cover}
h4{margin:12px 0 8px;color:var(--amber);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tc{background:rgba(15,21,34,.9);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;cursor:pointer;font-size:14px}
.tc img{width:56px;height:56px}
.tc small{color:var(--dim);font-size:12px;line-height:1.4}
.tc.on{border-color:var(--amber);background:rgba(60,44,16,.9)}
.mc{background:rgba(15,21,34,.9);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.mc .hd{display:flex;align-items:center;gap:8px;font-weight:700}
.mc .hd img{width:40px;height:40px}
.it{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.it .grow{flex:1;min-width:100px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button.on{background:var(--amber);color:#2a1a04;border-color:#ffc477;font-weight:700}
.evl{display:grid;gap:8px}
.ev{display:flex;gap:10px;background:#162034;border:1px solid var(--line);border-radius:12px;padding:8px}
.ev img{width:48px;height:48px;flex:none}
.ev b{display:block}
.ev span{font-size:13px;color:#cdd8e6;line-height:1.55}
.ev small{color:var(--dim);font-size:11px}
.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.su{background:#162034;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.su img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.su div{padding:8px 10px;font-size:13px;line-height:1.55}
.su q{display:block;color:#e8f0ff;margin:4px 0}
.su q:before{content:"「"}.su q:after{content:"」"}
.su.pick{cursor:pointer;border-width:3px}
.su.pick.on{border-color:var(--amber);box-shadow:0 0 20px rgba(242,165,65,.4)}
.opts{display:grid;gap:6px}
.opts button{text-align:left;white-space:normal;line-height:1.45}
.opts button.on{background:#3d3012;border-color:var(--amber)}
.res .rank{font-size:84px;font-weight:900;text-align:center;color:var(--amber);line-height:1;text-shadow:0 4px 0 #000}
.res table{width:100%;border-collapse:collapse;font-size:14px}
.res td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.ok{color:#8ff0a8}.ng{color:#ff9d93}
.truth p{line-height:1.7;margin:6px 0}
/* 聊天 */
#chat{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));width:min(340px,86vw);background:rgba(18,26,40,.96);border:1px solid var(--line);border-radius:14px;z-index:15;display:flex;flex-direction:column;max-height:46vh}
#chatLog{overflow:auto;padding:8px 10px;font-size:14px;line-height:1.5;flex:1;min-height:60px}
#chatLog b{color:var(--amber)}
#chatForm{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#chatForm input{flex:1;min-width:0}
.quick{display:flex;gap:4px;flex-wrap:wrap;padding:0 8px 6px}
.quick button{font-size:12px;padding:3px 8px;border-radius:8px}
.vcBadge{font-size:12px;margin-left:2px}
.vcBadge.failed{color:#ff9d93;cursor:pointer;text-decoration:underline}
.speak{box-shadow:0 0 0 2px #8ff0a8}
/* ---- v2：進度、目標、待處理、結果卡、教學 ---- */
.tutb{display:flex;flex-direction:column;align-items:center;width:100%;margin:6px 0 8px;padding:10px;background:linear-gradient(180deg,#1d4a52,#16343e);border:1px solid #2bb3a3;font-size:17px;font-weight:700}
.tutb small{font-weight:400;font-size:12px;color:#bfe;margin-top:2px}
.tutb.glow{box-shadow:0 0 0 2px rgba(43,179,163,.5),0 0 22px rgba(43,179,163,.35)}
.prog .pt{font-size:13px;font-weight:700}.prog b{color:#8ff0df}
.pbar{height:7px;border-radius:5px;background:#26324a;margin-top:4px;overflow:hidden;width:180px;max-width:100%}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2bb3a3,#8ff0df);transition:width .8s}
.obj{font-size:13px;line-height:1.5;color:#e6f4ff;border-color:#2b6f7a}
.obj b{color:#8ff0df}
.labs .pend{display:flex;gap:6px;align-items:baseline}
.labs .pend small{color:var(--dim)}
.evc.rc{flex-direction:column;gap:8px;border-color:#8ff0df;padding:12px 14px}
.evc.rc .rh{display:flex;gap:12px;align-items:center}
.evc.rc img{width:84px;height:84px;border-radius:12px;background:#0b1220}
.evc.rc .big{font-size:18px;font-weight:800;color:#fff}
.evc.rc .where{font-size:12px;color:#8ff0df;border-top:1px solid #2a3a50;padding-top:6px}
.evc.rc .where.wait{color:#ffd58a}
.evc.soft{border-color:#5a6a8a;box-shadow:0 0 20px rgba(0,0,0,.4);opacity:.96}
.newb{display:inline-block;font-size:11px;background:#2bb3a3;color:#04221e;border-radius:6px;padding:0 5px;margin-right:4px;font-weight:800}
.ev.isnew{border-color:#2bb3a3;box-shadow:0 0 0 1px #2bb3a3 inset}
#tut{position:absolute;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top));width:min(480px,94vw);background:rgba(14,24,36,.96);border:1px solid #2bb3a3;border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#tut img{width:52px;height:52px;border-radius:50%;flex:none;border:2px solid #2bb3a3}
#tut .tx{font-size:14px;line-height:1.6;flex:1}
#tut .tx b{color:#8ff0df}
#tut .st{font-size:11px;color:var(--dim)}
#tut button{margin-top:6px}
body.tutOn #cards{top:calc(170px + env(safe-area-inset-top))}
.hl{animation:hl 1.4s infinite;position:relative;z-index:2}
@keyframes hl{0%,100%{box-shadow:0 0 0 2px rgba(43,211,191,.9),0 0 14px rgba(43,211,191,.6)}50%{box-shadow:0 0 0 4px rgba(43,211,191,.4),0 0 24px rgba(43,211,191,.2)}}
.bossp{display:flex;gap:10px;align-items:center}
.bossp img{width:46px;height:46px}
@media (max-width:640px){
  .tr button .lbl{display:none}
  .tr{max-width:46vw}
  .tl{max-width:54vw}
  .ap .n{font-size:18px}
  .pips .patl{display:none}.pips .patb{width:60px}
  .slot{width:44px;height:44px}.slot img{width:36px;height:36px}
  #act{bottom:calc(62px + env(safe-area-inset-bottom));padding:8px 10px}
  #act p{font-size:12px;margin-bottom:6px}
  #act{padding:6px 8px;border-radius:12px;background:rgba(18,26,40,.88)}
  #act .ah{font-size:13px;margin-bottom:3px}
  #act .ad{display:none}
  #act .btns{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #act .btns::-webkit-scrollbar{display:none}
  #act .btns button{font-size:13px;padding:6px 8px;white-space:nowrap;flex:0 0 auto}
  #act .btns .why{font-size:10px}
  .win{border-radius:14px}
  .ov{padding:6px}
  .room{top:auto;bottom:calc(64px + env(safe-area-inset-bottom));font-size:13px}
  .labs{font-size:12px}
  #toasts{bottom:calc(66px + env(safe-area-inset-bottom))}
  #act:not(.hidden) ~ #toasts{display:none}
  .pbar{width:120px}
  .obj{font-size:12px}
  #tut{top:calc(112px + env(safe-area-inset-top));padding:8px}
  body.tutOn #obj{display:none}
  #tut img{width:40px;height:40px}
  #tut .tx{font-size:13px}
  body.tutOn #cards{top:calc(250px + env(safe-area-inset-top))}
}

/* v9 鑑識小遊戲 */
#mg{position:fixed;inset:0;z-index:12;background:rgba(3,5,9,.58);display:flex;align-items:center;justify-content:center;padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom))}
#mg.hidden{display:none}
.mgw{background:#0f141d;border:1px solid #2a3446;border-radius:14px;padding:10px;width:min(740px,100%);max-height:100%;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.mgh{display:flex;align-items:center;gap:8px;color:#e8ecf2}.mgh b{flex:1;font-size:16px}
#mgTime{color:#9fb0c8;font-variant-numeric:tabular-nums;font-size:14px}#mgTime.low{color:#ffb35a}
#mgX{min-height:36px;padding:4px 10px;border-radius:8px;border:1px solid #3a4a62;background:#1b2433;color:#cfd6e0;font-size:13px}
#mgHelp{color:#b8c4d6;font-size:13px;line-height:1.5}
#mgMsg{min-height:18px;color:#8ff0df;font-size:14px}#mgMsg.bad{color:#ffb0a0}
#mgC{width:min(100%,calc(60vh * 640 / 440));aspect-ratio:640/440;margin:0 auto;border-radius:10px;background:#000;touch-action:none;display:block;cursor:crosshair}
#mgF{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mgb{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid #3a4a62;background:#1b2433;color:#e8ecf2;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.mgb.main{background:#1f4a52;border-color:#3fb8a8}.mgb.hold.on{background:#2f6b5a}
.mgwait{color:#9fb0c8;padding:10px}
.qline{margin-top:6px;font-size:13px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.06);line-height:1.5}
.qv{font-weight:700}.q-good .qv{color:#7dff9a}.q-fair .qv{color:#f2d045}.q-poor .qv{color:#ff9a7a}
.qb{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;background:#2a3446;color:#cfd6e0}.qb.q-good{color:#7dff9a}.qb.q-fair{color:#f2d045}.qb.q-poor{color:#ff9a7a}
.mgt{font-size:10px;margin-left:6px;padding:1px 5px;border-radius:5px;background:#1f4a52;color:#8ff0df}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}table.cmp td,table.cmp th{border:1px solid #2a3446;padding:6px;text-align:center;vertical-align:top}
table.cmp td.ok{background:rgba(60,160,90,.2)}table.cmp td.ng{background:rgba(160,60,60,.2);color:#ffb0a0}table.cmp td.mix{background:rgba(200,160,40,.16)}table.cmp tr.sc td{background:rgba(79,210,255,.08)}.cmp small{color:var(--dim);margin-left:3px}.dim{color:var(--dim)}
label.rel{display:block;margin:4px 0 8px;font-size:14px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="joy" class="hidden"><i></i></div>

<!-- 首頁 -->
<div id="home" class="screen">
  <div class="card">
    <div class="logo"><img id="logoImg" alt=""><h1>鑑識現場</h1></div>
    <div class="logo sub">每一局都是新的命案</div>
    <div class="row"><label>名字</label><input id="name" maxlength="10" placeholder="你的名字" style="flex:1"></div>
    <div class="row"><label>隊員</label><div class="agents" id="agents"></div></div>
    <div class="row"><label>難度</label><select id="diff"><option value="easy">簡單（實驗室額度 14、1 個誘餌）</option><option value="normal" selected>普通（額度 11、2 個誘餌）</option><option value="hard">困難（額度 9、3 個誘餌）</option></select></div>
    <button id="bTut" class="tutb">🎓 新手教學<small>第一次玩先來這裡・約 5 分鐘・不會失敗</small></button>
    <div class="big">
      <button class="pri" id="bSolo">🕵️ 單人調查</button>
      <button id="bCreate">🏠 建立房間</button>
    </div>
    <div class="row" style="justify-content:center">
      <input id="joinCode" inputmode="numeric" maxlength="4" placeholder="房號">
      <button id="bJoin">🔑 加入房間</button>
    </div>
    <div class="note">一台行動鑑識車、一棟命案別墅，每局兇手、手法、兇器、第一現場都不一樣。帶對工具、關燈噴魯米諾、把關鍵證物送實驗室，對照鑑識手冊推理出<b>行兇方式</b>與<b>兇手</b>——兇手就混在封鎖線外的關係人裡。<br>電腦：WASD／方向鍵移動、E 互動、點地板自動走過去；手機：拖曳畫面當搖桿、點物件互動。</div>
    <div class="srv" id="srvLine"></div>
  </div>
</div>

<!-- 房間大廳 -->
<div id="roomScr" class="screen hidden">
  <div class="card">
    <div class="note" style="text-align:center">房號（告訴隊友，或分享連結）</div>
    <div class="code" id="rmCode">----</div>
    <div class="row" style="justify-content:center"><button id="bCopy">🔗 複製邀請連結</button><button id="rmVoice">🎤 加入語音</button><button id="rmChat">💬 聊天</button></div>
    <div class="row" style="justify-content:center"><label>難度</label><select id="rmDiff"><option value="easy">簡單</option><option value="normal">普通</option><option value="hard">困難</option></select></div>
    <div class="plist" id="plist"></div>
    <div class="note" id="rmNote">1～4 人合作。工具隨便用，送實驗室共用一份額度。</div>
    <div class="row" style="justify-content:space-between">
      <div class="row" style="margin:0"><button id="rmLeave">🚪 離開房間</button><button class="warn hidden" id="rmDissolve">💥 解散</button></div>
      <button class="pri" id="rmStart">▶ 開始調查</button>
    </div>
  </div>
</div>

<!-- 遊戲 HUD -->
<div id="hud" class="hidden">
  <div class="tl">
    <div class="chip"><div class="ap">🧪 實驗室額度 <span class="n" id="apN">0</span><span id="apMax" style="color:var(--dim);font-weight:400"></span></div><div class="pips" id="pips"></div></div>
    <div class="chip prog" id="prog" title="案情進度：鑑識手冊能排除多少手法與關係人、確定兇器與第一現場"><div class="pt">🧩 案情進度 <b id="progN">0%</b></div><div class="pbar"><i id="progBar"></i></div></div>
    <div class="team" id="team"></div>
    <div class="chip obj" id="obj"></div>
    <div class="chip labs hidden" id="labs"></div>
  </div>
  <div class="room" id="roomName"></div>
  <div class="tr">
    <button id="bNote">📒<span class="lbl">筆記本</span></button>
    <button id="bChat" class="hidden">💬<span class="lbl">聊天</span></button>
    <button id="bVc" class="hidden">🎤<span class="lbl">語音</span></button>
    <button id="bVcMute" class="hidden">🎙️<span class="lbl">靜音</span></button>
    <button id="bVcLeave" class="hidden">📴</button>
    <button id="bClose" class="amber">⚖️<span class="lbl">結案推理</span></button>
    <button id="bMenu">☰</button>
  </div>
  <div id="act" class="hidden"></div>
  <div id="toasts"></div>
  <div id="alertBar" class="hidden"></div>
  <div id="tut" class="hidden"></div>
  <div id="cards"></div>
  <div class="bar" id="bar"></div>
  <div class="keyhelp">WASD 移動・數字鍵 1–5 用工具・E 互動・N 筆記本</div>
</div>

<div id="chat" class="hidden">
  <div id="chatLog"></div>
  <div class="quick" id="quick"></div>
  <form id="chatForm"><input id="chatIn" maxlength="120" placeholder="跟隊友說…" autocomplete="off"><button class="pri">送出</button></form>
</div>

<div id="ov" class="ov hidden"><div class="win" id="win"></div></div>
<div id="mg" class="hidden"><div class="mgw"><div class="mgh"><b id="mgT"></b><span id="mgTime"></span><button id="mgX" type="button">放下工具<span class="kbonly"> [Esc]</span></button></div><div id="mgHelp"></div><canvas id="mgC" width="640" height="440"></canvas><div id="mgMsg"></div><div id="mgF"></div></div></div>

<script src="casegen.js?v=9"></script>
<script src="engine.js?v=9"></script>
<script src="assets.js?v=9"></script>
<script src="minigames.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
